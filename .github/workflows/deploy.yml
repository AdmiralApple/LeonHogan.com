name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild daily so the review log picks up anything new from Leons-Game-Reviews.
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # `npm install` rather than `npm ci`: a lockfile made on Windows lacks some
      # Linux-only optional packages, which makes `npm ci` refuse to run.
      - run: npm install --no-audit --no-fund
      # Pull the latest game log. If GitHub is having a moment, build with the committed copy.
      - run: npm run sync-reviews || echo "Review sync failed; using committed data"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
